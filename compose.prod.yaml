# Production compose for self-hosting DataForgeTest behind a Cloudflare Tunnel.
#
# This file is separate from docker-compose.yml on purpose: that one is the
# development flow and publishes ports on every interface. Nothing here is ever
# reachable from the LAN or the router — the only path in is the tunnel, which
# connects outbound to Cloudflare and forwards to 127.0.0.1:5000.
#
#   docker compose -f compose.prod.yaml up -d --build
#
# Its compose project name is its own, so it can never collide with the
# unrelated `meu-app` stack (Postgres) running on the same machine.
name: dataforgetest

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: dataforgetest-backend:prod
    container_name: dataforgetest-backend

    ports:
      # Loopback ONLY. cloudflared reaches this; the local network cannot.
      # Never change this to "5000:5000" — that publishes on 0.0.0.0.
      - "127.0.0.1:5000:5000"

    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=False

      # Required in production — the app refuses to start without it. This is
      # the *frontend* origin (Vercel), not the API domain.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://data-forge-test.vercel.app}

      # LLM: local Ollama only. No API key, no data leaving the machine.
      # Reached over the internal compose network; ollama publishes no port.
      - LLM_PROVIDER=ollama
      - LLM_MODEL=${LLM_MODEL:-qwen2.5-coder:7b}
      - OLLAMA_BASE_URL=http://ollama:11434

      # Uploads. MAX_UPLOAD_MB is the single limit every module reads; the hard
      # Flask wall is derived from it plus the overhead margin.
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-10}
      - UPLOAD_OVERHEAD_MB=${UPLOAD_OVERHEAD_MB:-2}

      # Rate limiting. NOTE: memory:// is per-process — with 2 gunicorn workers
      # the real limit is double what is configured, and it resets on restart.
      # Measured: a nominal "10 per minute" admitted 20 requests. Point this at
      # a shared backend before relying on these numbers.
      - RATELIMIT_STORAGE_URI=${RATELIMIT_STORAGE_URI:-memory://}

      # Diagnostics off: /api/rag/debug discloses provider, key presence,
      # absolute paths and indexed document names.
      - RAG_DEBUG_ENDPOINT=false

      # tests/ is excluded from the image, so /api/stats cannot count at runtime.
      - PLATFORM_TESTS_TOTAL=${PLATFORM_TESTS_TOTAL:-886}

      # Storage paths
      - VECTOR_STORE_PATH=./storage/vectorstore
      - SYNTH_STORAGE_PATH=./storage/synth
      - ACCURACY_STORAGE_PATH=./storage/accuracy
      - GOLD_STORAGE_PATH=./storage/gold

      # Feature limits
      - CHUNK_SIZE=${CHUNK_SIZE:-512}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-50}
      - TOP_K=${TOP_K:-4}
      - SYNTH_MAX_ROWS=${SYNTH_MAX_ROWS:-1000000}
      - SYNTH_REQUEST_TIMEOUT=${SYNTH_REQUEST_TIMEOUT:-300}
      - SYNTH_MAX_MEM_MB=${SYNTH_MAX_MEM_MB:-2048}
      - ACCURACY_MAX_ROWS=${ACCURACY_MAX_ROWS:-2000000}
      - ACCURACY_REQUEST_TIMEOUT=${ACCURACY_REQUEST_TIMEOUT:-120}
      - METRICS_MAX_ROWS=${METRICS_MAX_ROWS:-50000}
      - GOLD_ALLOWED_FILE_TYPES=${GOLD_ALLOWED_FILE_TYPES:-.csv,.xlsx,.xls,.parquet}
      - GOLD_REQUEST_TIMEOUT=${GOLD_REQUEST_TIMEOUT:-300}
      - MAX_ROWS_WARN=${MAX_ROWS_WARN:-500000}

      # Auth store (JSON array). Unset => empty store => every login fails.
      # Keep the real value in .env, never here.
      - AUTH_USERS=${AUTH_USERS:-}

    volumes:
      - ./storage:/app/storage
      - ./uploads:/app/uploads

    # Container hardening
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      # read_only makes the whole root filesystem immutable, so anything that
      # writes outside the two bind mounts above needs an explicit tmpfs.
      - /tmp:rw,noexec,nosuid,size=256m
      - /home/appuser/.cache:rw,noexec,nosuid,size=64m

    # Sized against a 16 GB host whose OrbStack VM has 8192 MiB and 10 CPUs.
    # backend + ollama must both fit inside the VM alongside the unrelated
    # meu-app Postgres.
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 2g

    depends_on:
      ollama:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  ollama:
    image: ollama/ollama:latest
    container_name: dataforgetest-ollama

    # NO ports section, deliberately. Ollama is reachable only from the backend
    # over the internal compose network, as http://ollama:11434. Publishing it
    # would expose an unauthenticated model-inference API.

    volumes:
      - ollama_models:/root/.ollama

    environment:
      - OLLAMA_HOST=0.0.0.0:11434  # inside the container's own namespace only

    # Ollama needs headroom for the model weights. Running in a Linux container
    # on macOS means CPU-only inference — there is no Metal GPU passthrough —
    # so it also wants CPU.
    deploy:
      resources:
        limits:
          cpus: "6.0"
          memory: 5g

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ollama_models:
